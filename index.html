<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurum Görev Takip Portalı</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 space-y-4">
        
        <!-- Başlık -->
        <div class="border-b pb-3">
            <h1 class="text-xl font-bold text-gray-800">Kurum İçi Not & Görev Portalı</h1>
            <p class="text-sm text-gray-500">İdareci ve Personel İletişim Paneli</p>
        </div>

        <!-- Kullanıcı Adı ve Rolü -->
        <div class="grid grid-cols-2 gap-2">
            <div>
                <label class="block text-xs font-medium text-gray-700">Adınız Soyadınız</label>
                <input id="userName" type="text" placeholder="Örn: Ahmet Yılmaz" class="w-full border rounded-lg p-2 text-sm bg-gray-50">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700">Kullanıcı Rolü</label>
                <select id="roleSelect" class="w-full border rounded-lg p-2 text-sm bg-gray-50 text-gray-800">
                    <option value="personel">Personel</option>
                    <option value="idareci">İdareci</option>
                </select>
            </div>
        </div>

        <!-- Not/Görev Yazma Alanı -->
        <div class="space-y-2 border-t pt-3">
            <label class="block text-sm font-medium text-gray-700">Yeni Duyuru / Not Paylaş</label>
            <textarea id="noteInput" class="w-full border rounded-lg p-2.5 text-sm" rows="3" placeholder="Notunuzu veya görevi buraya yazın..."></textarea>
            <button id="sendBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition">Gönder</button>
        </div>

        <!-- Akış / Notlar Listesi -->
        <div class="border-t pt-4 space-y-3">
            <h2 class="text-md font-semibold text-gray-700">Paylaşılan Notlar</h2>
            <div id="notesContainer" class="space-y-3">
                <p class="text-xs text-gray-400 text-center">Notlar yükleniyor...</p>
            </div>
        </div>

    </div>

    <!-- Firebase SDK (Canlı Veritabanı Modülü) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Ekran görüntünüzdeki yapılandırma bilgileri
        const firebaseConfig = {
            apiKey: "AIzaSyAbNoYgSL9kS1Ouzcr03ncHpvSvDv0lJs4",
            authDomain: "kurum-todo.firebaseapp.com",
            projectId: "kurum-todo",
            storageBucket: "kurum-todo.firebasestorage.app",
            messagingSenderId: "909388672371",
            appId: "1:909388672371:web:8629e2773e179c54a96906",
            measurementId: "G-5W7FJ9F1D7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const notesRef = collection(db, "notes");

        const sendBtn = document.getElementById("sendBtn");
        const noteInput = document.getElementById("noteInput");
        const userName = document.getElementById("userName");
        const roleSelect = document.getElementById("roleSelect");
        const notesContainer = document.getElementById("notesContainer");

        // Veritabanına Not Ekleme
        sendBtn.addEventListener("click", async () => {
            const text = noteInput.value.trim();
            const author = userName.value.trim() || "Anonim";
            const role = roleSelect.value;

            if (!text) {
                alert("Lütfen bir not yazın!");
                return;
            }

            try {
                await addDoc(notesRef, {
                    text: text,
                    author: author,
                    role: role,
                    createdAt: serverTimestamp()
                });
                noteInput.value = "";
            } catch (error) {
                console.error("Hata oluştu:", error);
                alert("Mesaj gönderilemedi.");
            }
        });

        // Canlı Veri Dinleme (Anlık Güncelleme)
        onSnapshot(notesRef, (snapshot) => {
            notesContainer.innerHTML = "";
            let notes = [];
            
            snapshot.forEach((doc) => {
                notes.push({ id: doc.id, ...doc.data() });
            });

            // Tarihe göre sıralama
            notes.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

            if (notes.length === 0) {
                notesContainer.innerHTML = `<p class="text-xs text-gray-400 text-center">Henüz bir not paylaşılmadı.</p>`;
                return;
            }

            notes.forEach((note) => {
                const isIdare = note.role === "idareci";
                const card = document.createElement("div");
                card.className = `${isIdare ? 'bg-blue-50 border-blue-500' : 'bg-gray-50 border-gray-400'} border-l-4 p-3 rounded text-sm space-y-1 shadow-sm`;
                
                card.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold ${isIdare ? 'text-blue-700' : 'text-gray-700'}">${note.author} (${isIdare ? 'İdareci' : 'Personel'})</span>
                    </div>
                    <p class="text-gray-800 text-sm">${note.text}</p>
                `;
                notesContainer.appendChild(card);
            });
        });
    </script>
</body>
</html>
